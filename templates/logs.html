{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-md-12">
        <h1>System Logs</h1>
        <div class="card">
            <div class="card-body">
                <div class="mb-3">
                    <label for="logLevel" class="form-label">Log Level</label>
                    <select class="form-select" id="logLevel" onchange="fetchLogs()">
                        <option value="INFO">Info</option>
                        <option value="ERROR">Error</option>
                        <option value="DEBUG">Debug</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="logLimit" class="form-label">Number of Logs</label>
                    <select class="form-select" id="logLimit" onchange="fetchLogs()">
                        <option value="50">50</option>
                        <option value="100" selected>100</option>
                        <option value="200">200</option>
                    </select>
                </div>
                <div class="mb-3">
                    <button class="btn btn-primary" onclick="fetchLogs()">Refresh Logs</button>
                </div>
                <div class="log-container bg-light p-3" style="max-height: 500px; overflow-y: auto;">
                    <pre id="logContent" class="mb-0"></pre>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function fetchLogs() {
        const level = document.getElementById('logLevel').value;
        const limit = document.getElementById('logLimit').value;
        const logContent = document.getElementById('logContent');

        fetch(`/api/logs?level=${level}&limit=${limit}`)
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    logContent.textContent = data.logs.join('\n');
                } else {
                    logContent.textContent = 'Error fetching logs: ' + data.message;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                logContent.textContent = 'Error fetching logs. Please try again.';
            });
    }

    // Fetch logs when page loads
    document.addEventListener('DOMContentLoaded', fetchLogs);
</script>
{% endblock %}
