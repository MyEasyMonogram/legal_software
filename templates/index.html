<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal Case Management</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    
    <style>
        .alert {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1050;
            min-width: 300px;
            max-width: 500px;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1>Legal Case Management</h1>
        
        <!-- Navigation Tabs -->
        <ul class="nav nav-tabs" id="mainTabs" role="tablist">
    <li class="nav-item" role="presentation">
        <button class="nav-link active" id="evidence-tab" data-bs-toggle="tab" data-bs-target="#evidence" type="button" role="tab">Evidence</button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" id="events-tab" data-bs-toggle="tab" data-bs-target="#events" type="button" role="tab">Events</button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" id="characters-tab" data-bs-toggle="tab" data-bs-target="#characters" type="button" role="tab">Characters</button>
    </li>
</ul>

        <!-- Tab Content -->
<div class="tab-content" id="mainTabContent">
    <!-- Evidence Tab -->
    <div class="tab-pane fade show active" id="evidence" role="tabpanel">
                <div class="d-flex justify-content-between align-items-center mt-4">
            <h2>Evidence</h2>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#uploadEvidenceModal">
                        <i class="fas fa-upload"></i> Upload Evidence
            </button>
        </div>
                
                <!-- Evidence content will be dynamically loaded here -->
    </div>

    <!-- Events Tab -->
    <div class="tab-pane fade" id="events" role="tabpanel">
                <!-- Events content will be dynamically loaded here -->
    </div>

    <!-- Characters Tab -->
    <div class="tab-pane fade" id="characters" role="tabpanel">
                <!-- Characters content will be dynamically loaded here -->
        </div>
    </div>
</div>

    <!-- Include modals here -->
    {% include 'modals.html' %}
    
    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Application Scripts -->
<script type="module">
        import { showAlert } from '/static/js/main.js';
        import { uploadEvidence, loadEvidence } from '/static/js/evidence.js';

        // Make functions available globally
        window.showAlert = showAlert;
        window.uploadEvidence = uploadEvidence;
        window.loadEvidence = loadEvidence;

        // Initialize the application
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                console.log('=== Initializing application ===');

                // Load initial data
                    await Promise.all([
                    loadEvidence(),
                    // Add other data loading functions here
                ]);
                
                console.log('Initial data loaded successfully');

    } catch (error) {
                console.error('Error initializing application:', error);
                showAlert('Error initializing application. Please refresh the page.', 'error');
            }
    });
</script>
</body>
</html>
